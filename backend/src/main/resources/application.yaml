server:
  port: 8080

spring:
  application:
    name: aviation-maintenance-assistant
  task:
    scheduling:
      enabled: true

app:
  rag:
    retrieval:
      max-results: 5
      min-score: 0.6
    query-translation:
      enabled: true

# IP 限流配置
rate-limit:
  chat:
    capacity: 20
    refill-period: 1h

# DeepSeek 全局日限额配置
deepseek:
  quota:
    daily-limit: 500

langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-chat
      temperature: 0.2
      timeout: PT60S
  chroma:
    embedding-store:
      base-url: http://localhost:8000
      collection-name: aviation-docs
      timeout: PT15S
