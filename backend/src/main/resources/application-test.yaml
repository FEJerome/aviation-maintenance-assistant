ama:
  llm:
    base-url: http://127.0.0.1:18089/v1
    api-key: test-only-credential
    model: synthetic-chat
    quota-enabled: false
  chroma:
    base-url: http://127.0.0.1:18090
    collection: synthetic-test-documents
  data-path: ./build/test-data
  state-path: ./build/test-state

rate-limit:
  chat:
    capacity: 2
    refill-period: 10s
