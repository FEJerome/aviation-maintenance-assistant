services:
  chromadb:
    image: chromadb/chroma:0.5.5
    container_name: ama-chromadb
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${AMA_CHROMA_DATA_PATH:-./backend/chroma-data}:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ama-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ama-backend
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AMA_RUNTIME_MODE: ${AMA_RUNTIME_MODE:-cloud-allowed}
      AMA_CHROMA_BASE_URL: http://chromadb:8000
      AMA_CHROMA_COLLECTION: ${AMA_CHROMA_COLLECTION:-aviation-docs}
      AMA_DATA_PATH: /app/data
      AMA_STATE_PATH: /app/state
      AMA_TRUST_PROXY_HEADERS: "false"
    volumes:
      - ./backend/data:/app/data:ro
      - ./backend/state:/app/state
    depends_on:
      chromadb:
        condition: service_healthy
    networks:
      - ama-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ama-frontend
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend
    networks:
      - ama-network

networks:
  ama-network:
    driver: bridge
